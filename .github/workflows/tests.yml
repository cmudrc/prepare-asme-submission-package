name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            tests/requirements.txt

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer poppler-utils

      - name: Install Python test dependencies
        run: python -m pip install --requirement tests/requirements.txt

      - name: Run regression suite
        run: python -m unittest discover --start-directory tests --verbose
